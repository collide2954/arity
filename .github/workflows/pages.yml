name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MDBOOK: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: collide2954/arity-data
          path: arity-data
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --package arity-cli
      - name: Rebuild the database from arity-data
        run: target/release/arity --data data rebuild arity-data
      - run: target/release/arity --data data export web/public/data
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
        env:
          ARITY_BASE: /arity/
      - name: Build the documentation
        run: |
          curl --fail --silent --show-error --location --output mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK/mdbook-$MDBOOK-x86_64-unknown-linux-gnu.tar.gz"
          echo "$MDBOOK_SHA256  mdbook.tar.gz" | sha256sum --check
          tar --extract --gzip --file mdbook.tar.gz
          ./mdbook build docs
          cp -r docs/book web/dist/docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
