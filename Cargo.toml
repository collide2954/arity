[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/collide2954/arity"
publish = false

[workspace.dependencies]
arity-core = { path = "crates/arity-core" }
arity-jats = { path = "crates/arity-jats" }
arity-protocol = { path = "crates/arity-protocol" }
arity-sheets = { path = "crates/arity-sheets" }
arity-site = { path = "crates/arity-site" }
arity-sources = { path = "crates/arity-sources" }
arity-store = { path = "crates/arity-store" }
arity-text = { path = "crates/arity-text" }
arity-units = { path = "crates/arity-units" }
calamine = "0.38.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
hex = "0.4.3"
jiff = { version = "1.0.1", features = ["serde"] }
proptest = "1.12.0"
regex = "1.13.1"
roxmltree = "0.21.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust_xlsxwriter = "0.102.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
unicode-normalization = "0.1.26"
ureq = "3.5.2"
url = "2.5.8"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
